name: Soma
options:
  bundleIdPrefix: top.hedon
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 3
    MARKETING_VERSION: 0.0.1
packages:
  SwiftOpenAI:
    url: https://github.com/jamesrochabrun/SwiftOpenAI.git
    exactVersion: 4.5.0
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui.git
    exactVersion: 2.4.1
targets:
  Soma:
    type: application
    platform: iOS
    sources:
      - path: Soma
      - path: Shared
    dependencies:
      - package: SwiftOpenAI
      - package: MarkdownUI
      - target: SomaWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.hedon.soma
        CODE_SIGN_ENTITLEMENTS: Soma/Soma.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Soma/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - SomaTests
  SomaWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SomaWidget
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.hedon.soma.widget
        PRODUCT_NAME: SomaWidgetExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: SomaWidget/Resources/Info.plist
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  SomaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: SomaTests
    dependencies:
      - target: Soma
      - package: SwiftOpenAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.hedon.soma.tests
        GENERATE_INFOPLIST_FILE: YES
