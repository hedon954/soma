name: Bug report
description: 报告可复现的 Soma 问题
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请只使用虚构数据复现，不要上传真实身体照片、健康记录、
        API Key、证书、完整私有 Trace 或包含 Authorization 的日志。
  - type: textarea
    id: outcome
    attributes:
      label: 发生了什么
      description: 请描述实际结果和对使用的影响。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 发送虚构示例……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Soma 版本
      placeholder: 例如 1.0.0 (1)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 设备与系统
      placeholder: 例如 iPhone 17 Pro / iOS 26.2
    validations:
      required: true
  - type: dropdown
    id: data-space
    attributes:
      label: 数据空间
      options:
        - 演示数据
        - 个人数据（不要附真实内容）
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我确认本 Issue 不包含真实健康数据、身体照片、密钥或签名资产
          required: true
