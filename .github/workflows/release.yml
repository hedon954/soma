name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish source release
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify release metadata
        run: ./scripts/verify-release.sh "$GITHUB_REF_NAME"

      - name: Verify Xcode 26.6
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install development tools
        run: brew bundle --file Brewfile

      - name: Install Agent server dependencies
        run: npm --prefix Server ci

      - name: Run complete quality gate
        run: make verify

      - name: Extract reviewed release notes
        run: ./scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > build/RELEASE_NOTES.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "Soma $GITHUB_REF_NAME" \
            --notes-file build/RELEASE_NOTES.md
