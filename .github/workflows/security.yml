name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/dependency-review-action@v5

  codeql:
    name: CodeQL Swift
    if: github.event.repository.visibility == 'public'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v6

      - name: Select newest installed Xcode
        shell: bash
        run: |
          xcode_path="$(find /Applications -maxdepth 1 -type d -name 'Xcode_[0-9]*.app' | sort -V | tail -1)"
          test -n "$xcode_path"
          echo "DEVELOPER_DIR=$xcode_path/Contents/Developer" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: make generate

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: swift
          build-mode: manual
          queries: security-extended

      - name: Build for analysis
        run: ./scripts/xcodebuild.sh build

      - name: Analyze
        uses: github/codeql-action/analyze@v4
