name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast static quality gates
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Server/package-lock.json

      - name: Install development tools
        run: brew bundle --file Brewfile

      - name: Install Agent server dependencies
        run: npm --prefix Server ci

      - name: Run fast static quality gate
        run: make check
