name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Fast static quality gates
    runs-on: macos-15
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Install development tools
        run: brew bundle --file Brewfile

      - name: Run fast static quality gate
        run: make check
